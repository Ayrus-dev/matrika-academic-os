<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#03060A">
<meta name="mobile-web-app-capable" content="yes">
<title>MATRIKA — Turn your syllabus into a system</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#03060A; --panel:#07121A; --panel2:#0B1B25;
  --line:rgba(57,255,136,.30); --line2:rgba(120,255,190,.10); --linehi:rgba(57,255,136,.65);
  --g:#39FF88; --c:#28E0FF; --v:#A78BFF; --b:#4D8DFF; --amber:#FFB547; --red:#FF5A7A;
  --tx:#DDF6EA; --tx2:#8DB3A2; --tx3:#5F8070;
  --f-disp:'Chakra Petch','Rajdhani',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.45 var(--f-body);overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 55% at 50% -8%,rgba(57,255,136,.08),transparent 62%),
  linear-gradient(rgba(57,255,136,.032) 1px,transparent 1px) 0 0/32px 32px,
  linear-gradient(90deg,rgba(57,255,136,.032) 1px,transparent 1px) 0 0/32px 32px;
  -webkit-mask-image:linear-gradient(#000 40%,transparent 100%);mask-image:linear-gradient(#000 40%,transparent 100%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
.sweep{display:none;position:fixed;left:0;right:0;top:0;height:140px;pointer-events:none;z-index:49;
  background:linear-gradient(to bottom,transparent,rgba(57,255,136,.045),transparent);animation:sweep 11s linear infinite}
@keyframes sweep{from{transform:translateY(-160px)}to{transform:translateY(110vh)}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.disp{font-family:var(--f-disp)} .mono{font-family:var(--f-mono)}
#shell{position:relative;z-index:1;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:600px){#shell{border-left:1px solid var(--line2);border-right:1px solid var(--line2)}}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:14px 16px 28px;position:relative;z-index:1}
.onb #nav{display:none}

/* --- panels (chamfered, glowing edge) --- */
.pn{--cut:12px;position:relative;background:var(--bd,rgba(57,255,136,.2));
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.pn::before{content:"";position:absolute;inset:1px;background:var(--pbg,var(--panel));
  clip-path:polygon(0 0,calc(100% - var(--cut) + 1px) 0,100% calc(var(--cut) - 1px),100% 100%,calc(var(--cut) - 1px) 100%,0 calc(100% - var(--cut) + 1px))}
.pn>*{position:relative}
.in{padding:14px 14px 15px}
.lbl{font:600 10.5px/1.2 var(--f-mono);letter-spacing:.16em;color:var(--tx2);text-transform:uppercase}
.lbl.c{color:var(--c)} .lbl.g{color:var(--g)}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.sec{margin-top:22px} .sec>.lbl{display:block;margin-bottom:10px}
.fine{font:400 10.5px/1.4 var(--f-mono);color:var(--tx3);margin-top:10px}
.center{text-align:center}

/* --- buttons --- */
.btn{position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;
  background:var(--g);color:#02110A;font:700 12.5px/1.1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;text-align:center;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:filter .2s,transform .12s}
.btn:active{transform:scale(.98);filter:brightness(1.2)}
.btn.ghost{background:var(--bl,var(--linehi));color:var(--bt,var(--g))}
.btn.ghost::before{content:"";position:absolute;inset:1px;background:var(--panel);z-index:-1;
  clip-path:polygon(9.3px 0,100% 0,100% calc(100% - 9.3px),calc(100% - 9.3px) 100%,0 100%,0 9.3px)}
.btn.cy{--bl:rgba(40,224,255,.7);--bt:var(--c)}
.btn.dg{--bl:rgba(255,90,122,.7);--bt:var(--red)}
.btn.sm{min-height:44px;padding:0 14px;font-size:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn.pulse{animation:none}
@keyframes pulse{50%{filter:brightness(1.28)}}
.ibtn{width:44px;height:44px;display:grid;place-items:center;color:var(--tx2);border:1px solid var(--line2);flex:none;transition:color .2s,border-color .2s}
.ibtn:active,.ibtn[aria-pressed=true]{color:var(--g);border-color:var(--line)}
.ibtn.sm{width:44px}
.ic{display:block}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 7px;font:600 9.5px/1 var(--f-mono);letter-spacing:.1em;border:1px solid currentColor;color:var(--tx2);white-space:nowrap}
.chip.red{color:var(--red)} .chip.amber{color:var(--amber)} .chip.cy{color:var(--c)} .chip.gr{color:var(--g)} .chip.vi{color:var(--v)}

/* --- header --- */
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px}
.brand{font:700 23px/1 var(--f-disp);letter-spacing:.07em}
.brand span{color:var(--g);text-shadow:0 0 10px rgba(57,255,136,.3)}
.status{display:flex;align-items:center;gap:8px;margin-top:7px;font:600 10px/1 var(--f-mono);letter-spacing:.16em;color:var(--tx2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 9px var(--g);animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.ph h1{font:700 26px/1.1 var(--f-disp);letter-spacing:.05em}
.ph p{font:500 11px/1.5 var(--f-mono);color:var(--tx2);margin-top:6px;letter-spacing:.04em}
.ph{margin-bottom:16px}

/* --- dial (signature element) --- */
.dial{position:relative;width:min(74vw,286px);aspect-ratio:1;margin:2px auto 4px}
.dial svg{width:100%;height:100%;display:block;overflow:visible}
.dial .seg{stroke:rgba(57,255,136,.13);stroke-width:4.4}
.dial .seg.i2{stroke:rgba(40,224,255,.15);stroke-width:2.6}
.dial .seg.on{stroke:var(--g)} .dial .seg.i2.on{stroke:var(--c)}
.dial .orb{fill:none;stroke:rgba(57,255,136,.4);stroke-width:1;stroke-dasharray:1 6}
.dial .arc{fill:none;stroke:var(--g);stroke-width:1.8;stroke-dasharray:120 660;stroke-linecap:round;opacity:.85}
.dial .tick{fill:none;stroke:rgba(40,224,255,.35);stroke-width:1.2;stroke-dasharray:1.5 7}
.dial .spin{transform-box:view-box;transform-origin:130px 130px}
.dial .spin.a{animation:spin 64s linear infinite}
.dial .spin.b{animation:spin 90s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.dial .core{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.big{font:700 clamp(46px,14.5vw,62px)/1 var(--f-disp);text-shadow:0 0 14px rgba(57,255,136,.3);font-variant-numeric:tabular-nums}
.big em{font-size:.42em;font-style:normal;color:var(--g);margin-left:2px}
.dial .core .lbl{margin-top:6px;font-size:9.5px}
.fresh .dial .seg.on{animation:segOn .5s both;animation-delay:calc(var(--i)*14ms)}
@keyframes segOn{from{opacity:.05;stroke:#fff}to{opacity:1}}
.dial.hero .seg{stroke:var(--g);animation:heroSeg 3.4s ease-in-out infinite;animation-delay:calc(var(--i)*55ms)}
.dial.hero .seg.i2{stroke:var(--c)}
@keyframes heroSeg{0%,100%{opacity:.14}45%{opacity:1}}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.legend>div{padding-left:10px;border-left:2px solid var(--g)}
.legend>div.r{border-color:var(--c)}
.legend b{display:block;font:700 19px/1.15 var(--f-disp);margin-top:4px}
.legend small{font:400 10.5px var(--f-mono);color:var(--tx3)}

/* --- bars --- */
.bar{position:relative;height:10px;background:rgba(57,255,136,.09);
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 9px);mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 9px)}
.bar>i{position:absolute;inset:0 auto 0 0;width:0;background:var(--bc,var(--g));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.thin{height:5px}
.bar.cy{--bc:var(--c);background:rgba(40,224,255,.09)}

/* --- cards --- */
.card{display:block;width:100%;text-align:left;transition:transform .15s}
.card:active{transform:scale(.985)}
.card .in{display:block}
.subj{--bd:color-mix(in srgb,var(--sc) 38%,transparent)}
.subj h3{font:700 17px/1.2 var(--f-disp);letter-spacing:.06em;text-transform:uppercase}
.subj .pctn{font:700 22px/1 var(--f-disp);color:var(--sc);text-shadow:0 0 14px color-mix(in srgb,var(--sc) 55%,transparent)}
.subj .pctn i{font-style:normal;font-size:.6em}
.subj .bar{margin:11px 0 9px;--bc:var(--sc)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 10.5px/1.2 var(--f-mono);letter-spacing:.06em;color:var(--tx2)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:block;text-align:left;width:100%}
.tile b{display:block;font:700 30px/1 var(--f-disp);margin:8px 0 6px}
.tile small{font:400 10.5px/1.3 var(--f-mono);color:var(--tx3)}
.tile.warn b{color:var(--amber)} .tile.hot b{color:var(--red)}
.sigmsg{font:500 16px/1.5 var(--f-body);margin:9px 0 14px}
.qrow{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:9px 4px 9px 0;border-bottom:1px solid var(--line2);color:var(--tx2)}
.qtag{font:700 9.5px var(--f-mono);letter-spacing:.12em;padding:4px 6px;border:1px solid;flex:none;width:58px;text-align:center}
.qtag.revise{color:var(--c)} .qtag.study{color:var(--g)}
.qmain{flex:1;min-width:0} .qmain b{display:block;color:var(--tx);font:600 14px/1.25 var(--f-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qmain small{font:400 10.5px var(--f-mono);color:var(--tx3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-panel{padding:4px 14px}
.list-panel .qrow:last-child{border-bottom:0}

/* --- topics / swipe --- */
.swipe{position:relative;touch-action:pan-y;margin-bottom:9px}
.swipe .hint{position:absolute;inset:0;display:flex;align-items:center;padding:0 16px;font:700 10.5px var(--f-mono);letter-spacing:.14em;opacity:0}
.swipe .hint.r{justify-content:flex-start;color:var(--g);background:linear-gradient(90deg,rgba(57,255,136,.22),transparent)}
.swipe .hint.l{justify-content:flex-end;color:var(--amber);background:linear-gradient(270deg,rgba(255,181,71,.2),transparent)}
.swipe.sw[data-dir=r] .hint.r,.swipe.sw[data-dir=l] .hint.l{opacity:1}
.tcard{--cut:10px;transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.tcard.t-studied{--bd:rgba(57,255,136,.42)} .tcard.t-mastered{--bd:rgba(40,224,255,.55)} .tcard.t-studying{--bd:rgba(255,181,71,.4)} .tcard.t-notstarted{--bd:var(--line2)}
.tcard .in{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 6px}
.glyph{width:48px;height:48px;display:grid;place-items:center;flex:none;position:relative}
.gl{filter:drop-shadow(0 0 3px currentColor)}
.tbody{flex:1;min-width:0;padding:6px 4px;display:block}
.tname{display:block;font:600 14.5px/1.3 var(--f-body);color:var(--tx)}
.t-notstarted .tname{color:var(--tx2)}
.pips{display:inline-flex;gap:2px;align-items:center;font:600 9px var(--f-mono);color:var(--tx3);letter-spacing:.1em}
.pips s{width:5px;height:9px;background:rgba(141,179,162,.22);display:block;text-decoration:none}
.pips s.f{background:var(--tx2)}
.pips.imp s.f{background:var(--v)}
.tools{display:flex;gap:6px;padding:0 8px 8px 8px;border-top:1px solid var(--line2);padding-top:8px}
.tools .ibtn{flex:1;width:auto}
.tcard.xform::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(57,255,136,.42),transparent);animation:sweepx .8s ease-out both;pointer-events:none}
.tcard.xform .gl{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes sweepx{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes pop{0%{transform:scale(.4) rotate(-40deg)}100%{transform:scale(1)}}
.chap{margin-top:14px}
.chead{display:flex;align-items:center}
.ctoggle{flex:1;display:flex;align-items:center;gap:10px;min-height:52px;text-align:left}
.cname{flex:1;font:700 15px/1.25 var(--f-disp);letter-spacing:.05em;text-transform:uppercase}
.cprog{font:600 11px var(--f-mono);color:var(--tx2)}
.chev{transition:transform .25s;color:var(--tx3)} .open .chev{transform:rotate(90deg)}
.cbody{display:none;padding-top:12px} .open .cbody{display:block;animation:fade .25s}
.chap .bar{margin-bottom:0}

/* --- segmented control --- */
.segc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.segc button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:62px;padding:6px 2px;border:1px solid var(--line2);font:600 9px/1.15 var(--f-mono);letter-spacing:.08em;color:var(--tx3);text-align:center;transition:all .25s}
.segc button.on{color:var(--tx);border-color:currentColor;background:rgba(255,255,255,.04);box-shadow:inset 0 0 18px rgba(57,255,136,.08)}
.segc .s-studying.on{color:var(--amber)} .segc .s-studied.on{color:var(--g)} .segc .s-mastered.on{color:var(--c)} .segc .s-notstarted.on{color:var(--tx2)}
.pick{display:flex;gap:6px}
.pick button{flex:1;min-height:46px;border:1px solid var(--line2);font:700 13px var(--f-mono);color:var(--tx3);transition:all .2s;text-align:center}
.pick button.on{color:var(--g);border-color:var(--g);background:rgba(57,255,136,.08)}
.pick.sw button{min-height:44px;border-width:2px;border-color:transparent}
.pick.sw button.on{border-color:var(--tx)}
.pick.conf button.on{color:var(--tx)}

/* --- lists in sheet --- */
.cyc{list-style:none;margin:0;padding:0}
.cyc li{display:flex;align-items:center;gap:12px;min-height:42px;border-left:1px dashed var(--line);margin-left:9px;padding-left:16px;position:relative;font:600 11.5px var(--f-mono);letter-spacing:.06em;color:var(--tx3)}
.cyc li::before{content:"";position:absolute;left:-6px;top:50%;width:11px;height:11px;margin-top:-5px;border:1.5px solid var(--tx3);background:var(--panel);transform:rotate(45deg)}
.cyc li.d{color:var(--tx)} .cyc li.d::before{background:var(--g);border-color:var(--g);box-shadow:0 0 8px var(--g)}
.cyc li.n{color:var(--c)} .cyc li.n::before{border-color:var(--c)}
.cyc li span:last-child{margin-left:auto;font-weight:400;color:var(--tx2)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper b{min-width:28px;text-align:center;font:700 20px var(--f-disp)}
.sub{display:flex;align-items:center;gap:6px;min-height:46px;border-bottom:1px solid var(--line2)}
.sub button.tg{display:flex;align-items:center;gap:12px;flex:1;min-height:46px;text-align:left}
.sub .bx{width:20px;height:20px;border:1.5px solid var(--tx3);display:grid;place-items:center;flex:none;color:#02110A}
.sub.d .bx{background:var(--g);border-color:var(--g)} .sub.d .st{color:var(--tx3);text-decoration:line-through}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .btn{padding:0 10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2);font:500 12px var(--f-mono)}
.kv span:first-child{color:var(--tx3)}

/* --- forms --- */
.fld{display:block;margin-bottom:14px}
.fld>.lbl{display:block;margin-bottom:7px}
.fld small{display:block;margin-top:5px;font:400 10.5px var(--f-mono);color:var(--tx3)}
input[type=text],input[type=date],select,textarea{width:100%;min-height:48px;padding:11px 13px;background:#040B10;border:1px solid var(--line2);border-radius:0;font:500 15px var(--f-body);color:var(--tx);color-scheme:dark;-webkit-appearance:none;appearance:none}
textarea{resize:vertical;min-height:120px;font:400 13px/1.5 var(--f-mono)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(57,255,136,.14)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.err{color:var(--red);font:500 12px var(--f-mono);min-height:0;margin:-4px 0 10px}
.err:empty{display:none}
.form-actions{display:flex;gap:10px;margin-top:6px}.form-actions .btn{flex:1}
.inline{display:flex;gap:8px;align-items:stretch}.inline input{flex:1}
.inline .btn{padding:0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1px solid var(--line);font:600 12px var(--f-mono);letter-spacing:.06em;color:var(--tx)}
.chipbtn.add{color:var(--tx2);border-style:dashed}
.chipbtn.add:active{color:var(--g);border-color:var(--g)}

/* --- sheets --- */
#layer{position:absolute;inset:0;pointer-events:none;z-index:20}
.ov{position:absolute;inset:0;background:rgba(1,4,6,.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);pointer-events:auto;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;display:flex;flex-direction:column;pointer-events:auto;isolation:isolate;outline:none;
  background:var(--linehi);animation:rise .25s cubic-bezier(.2,.9,.25,1);
  clip-path:polygon(0 18px,18px 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.sheet::before{content:"";position:absolute;inset:1px 1px 0;background:var(--panel);z-index:-1;clip-path:polygon(0 17px,17px 0,calc(100% - 17px) 0,100% 17px,100% 100%,0 100%)}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:20px 16px 8px 18px;flex:none}
.shead h2{font:700 20px/1.2 var(--f-disp);letter-spacing:.03em;margin-top:5px}
.sbody{overflow-y:auto;overscroll-behavior:contain;padding:8px 18px 26px;flex:1;min-height:0}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.screen>*{}
.slide{animation:slidein .32s cubic-bezier(.2,.9,.25,1)}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.tabin{animation:tabin .28s ease-out}
@keyframes tabin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* --- nav --- */
#nav{position:relative;flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(3,8,12,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:5}
#nav button{position:relative;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--tx3);font:600 9.5px/1 var(--f-mono);letter-spacing:.05em;transition:color .25s;text-align:center}
#nav button[aria-current=page]{color:var(--g)}
#nav button[aria-current=page] .ic{filter:drop-shadow(0 0 3px var(--g))}
#nav .ic{transition:transform .3s cubic-bezier(.3,1.5,.4,1)}

.badge{position:absolute;top:8px;left:calc(50% + 7px);min-width:16px;height:16px;padding:0 4px;background:var(--red);color:#fff;font:700 9px/16px var(--f-mono);text-align:center;letter-spacing:0}

/* --- misc --- */
.empty{text-align:center;padding:28px 18px}
.empty .art{width:96px;height:96px;margin:0 auto 14px;color:var(--g)}
.empty h2{font:700 19px var(--f-disp);letter-spacing:.1em;margin-bottom:8px}

.empty .btns{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.leader{display:flex;align-items:baseline;gap:8px;padding:11px 0 5px;font:500 13.5px var(--f-mono)}
.leader i{flex:1;border-bottom:1px dotted var(--tx3);transform:translateY(-4px)}
.leader b{font:700 15px var(--f-disp);color:var(--g)}
.total{margin-top:12px;font-weight:700}
.toastbox{position:absolute;left:12px;right:12px;bottom:76px;z-index:30;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:#0A1A23;border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.6);font:600 11.5px/1.35 var(--f-mono);letter-spacing:.04em;animation:rise .25s ease-out}
.toast.out{opacity:0;transform:translateY(8px);transition:all .3s}
.tundo{color:var(--c);font:700 11px var(--f-mono);letter-spacing:.14em;min-height:44px;padding:0 8px;margin:-8px -6px -8px 0}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;font:700 11px var(--f-mono);letter-spacing:.14em;color:var(--tx2);margin:-8px 0 4px -6px;padding:0 6px}
.subhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.subhead h1{font:700 26px/1.1 var(--f-disp);letter-spacing:.04em;text-transform:uppercase;text-shadow:0 0 18px color-mix(in srgb,var(--sc) 45%,transparent)}
.bigp{font:700 44px/1 var(--f-disp);color:var(--sc)}
.bigp i{font-style:normal;font-size:.45em}
.toolbar{display:flex;gap:8px;margin-top:14px}.toolbar .btn{flex:1}
.lock .art{width:180px;margin:0 auto 6px;opacity:.85}
.lock h2{font:700 20px/1.25 var(--f-disp);margin:8px 0 10px}
.lock p{color:var(--tx2);font-size:14px;margin:0 auto 6px;max-width:34ch}
.ghostnum{font:700 54px var(--f-disp);color:var(--tx3);letter-spacing:.06em}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.tabs button{min-height:56px;border:1px solid var(--line2);font:700 9.5px/1.2 var(--f-mono);letter-spacing:.08em;color:var(--tx3);padding:6px 2px;text-align:center;transition:all .2s}
.tabs button b{display:block;font:700 20px var(--f-disp);margin-bottom:2px;color:var(--tx2)}
.tabs button.on{color:var(--g);border-color:var(--g);background:rgba(57,255,136,.07)}.tabs button.on b{color:var(--g)}
.tabs button.t-od.on{color:var(--red);border-color:var(--red);background:rgba(255,90,122,.07)}.tabs button.t-od.on b{color:var(--red)}
.tabs button.t-td.on{color:var(--amber);border-color:var(--amber);background:rgba(255,181,71,.07)}.tabs button.t-td.on b{color:var(--amber)}
.dots{display:inline-flex;gap:3px}.dots s{display:block;width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--tx3)}.dots s.f{background:var(--g);border-color:var(--g)}
.prev-item{padding:4px 0 4px calc(var(--l)*14px);font:500 12px/1.5 var(--f-mono);color:var(--tx2)}
.prev-item.s{color:var(--g);font-weight:700;margin-top:6px}
.prev-item.c{color:var(--tx)}
.prev-box{max-height:220px;overflow:auto;border:1px solid var(--line2);padding:8px 10px;margin-bottom:12px;background:#040B10}
.opt{display:block;width:100%;text-align:left;margin-bottom:10px}
.opt .in{display:flex;align-items:center;gap:12px;min-height:60px}
.opt b{display:block;font:700 14px var(--f-disp);letter-spacing:.08em}.opt small{font:400 11.5px/1.4 var(--f-mono);color:var(--tx2)}
.opt.on{--bd:var(--g)}
.steps{display:flex;gap:5px;margin-bottom:22px}.steps i{flex:1;height:3px;background:rgba(57,255,136,.14)}.steps i.f{background:var(--g);box-shadow:0 0 8px var(--g)}
.onbwrap{min-height:100%;display:flex;flex-direction:column}
.onbwrap .grow{flex:1}
.onbtitle{font:700 28px/1.1 var(--f-disp);letter-spacing:.04em;margin-bottom:8px}
.onbsub{color:var(--tx2);margin-bottom:20px;font-size:14px}
.hero-t{font:700 40px/1 var(--f-disp);letter-spacing:.14em;text-align:center;margin-top:8px;text-shadow:0 0 24px rgba(57,255,136,.5)}
.hero-s{font:600 12px/1.6 var(--f-mono);letter-spacing:.2em;text-align:center;color:var(--tx2);margin:12px 0 26px}
.textlink{display:block;width:100%;min-height:48px;margin-top:6px;font:600 11px var(--f-mono);letter-spacing:.12em;color:var(--tx3);text-align:center}
.boot li{list-style:none;font:500 12.5px/1 var(--f-mono);color:var(--tx2);padding:12px 0;border-bottom:1px solid var(--line2);opacity:0;animation:appear .3s both;letter-spacing:.04em}

.boot{margin:0;padding:0}
.done-t{font:700 26px/1.2 var(--f-disp);letter-spacing:.06em;color:var(--g);text-shadow:0 0 22px rgba(57,255,136,.55);margin:26px 0 18px;opacity:0;animation:appear .5s 2.2s both}

@keyframes appear{from{opacity:0;visibility:hidden;transform:translateY(6px)}to{opacity:1;visibility:visible;transform:none}}
.priv{display:grid;gap:8px;margin-bottom:6px}
.priv div{display:flex;justify-content:space-between;gap:10px;font:500 11.5px var(--f-mono);padding:9px 0;border-bottom:1px solid var(--line2)}
.priv b{font-weight:700}.priv .ok{color:var(--g)}.priv .off{color:var(--tx3)}
details summary{min-height:44px;display:flex;align-items:center;font:700 11px var(--f-mono);letter-spacing:.12em;color:var(--c);cursor:pointer}

/* --- phase 3: timer, history, time stats --- */
.segc.c3{grid-template-columns:repeat(3,1fr)}.segc.c3 button{min-height:48px;font-size:9.5px}
.segc button[disabled]{opacity:.42;cursor:not-allowed}
.tdial{width:min(84vw,330px)}

.dial.brk .seg.on{stroke:var(--c)}.dial.brk .big{text-shadow:0 0 22px rgba(40,224,255,.5)}
.dial.idle .spin{animation-play-state:paused}
.dial .core .phase{margin-top:8px;font:700 10px var(--f-mono);letter-spacing:.18em;color:var(--tx2)}
.stepper b{min-width:46px}
.tile .in{display:block}
.tstats .lbl{font-size:9px;letter-spacing:.1em;display:block;min-height:22px}
.ctl3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}.ctl3 .btn{padding:0 6px;font-size:11.5px;letter-spacing:.1em}
.tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tstats>div{padding:10px 8px;border:1px solid var(--line2);min-width:0}
.tstats b{display:block;font:700 17px/1.2 var(--f-disp);margin-top:7px;white-space:nowrap}
.tdot{position:absolute;top:10px;left:calc(50% + 8px);width:7px;height:7px;background:var(--amber);border-radius:50%;box-shadow:0 0 8px var(--amber);animation:blink 1.4s infinite}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.frow select{font-size:13px;min-height:46px;padding:0 30px 0 12px;background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px}
.dayh{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 2px}
.hrow{display:flex;align-items:center;gap:10px;min-height:62px;border-bottom:1px solid var(--line2)}
.ht{font:600 12px var(--f-mono);color:var(--tx3);width:42px;flex:none}
.hm{flex:1;min-width:0}.hm b{display:block;font:700 14px/1.25 var(--f-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm small{display:block;font:400 11px var(--f-mono);color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdur{font:700 15px var(--f-disp);white-space:nowrap}
.hrow .ibtn{border:0;width:40px;color:var(--tx3)}
.bars7{display:flex;gap:7px;align-items:flex-end}.bars7>div{flex:1;text-align:center;min-width:0}
.bcol{height:96px;display:flex;align-items:flex-end;background:rgba(57,255,136,.05);border:1px solid var(--line2)}
.bcol i{display:block;width:100%;background:linear-gradient(to top,var(--g),rgba(57,255,136,.35));transform-origin:bottom;animation:growY .8s cubic-bezier(.2,.8,.2,1) both}
.bars7 small{display:block;margin-top:6px;font:600 10px var(--f-mono);color:var(--tx3)}.bars7 .td small{color:var(--g)}
.bars7 em{display:block;font:500 9.5px var(--f-mono);font-style:normal;color:var(--tx2);margin-top:2px}
@keyframes growY{from{transform:scaleY(0)}}

/* --- phase 6: mission, level, milestones, heatmap --- */
.ob{font:600 10px var(--f-mono);letter-spacing:.06em;color:var(--tx3);white-space:nowrap}.ob.ok{color:var(--g)}
.pi{display:flex;align-items:center;gap:10px;min-height:58px;border-bottom:1px solid var(--line2)}
.pi .no{font:700 13px var(--f-mono);color:var(--c);width:26px;flex:none}
.pi.done .no{color:var(--g)}.pi.done .pn2{text-decoration:line-through;color:var(--tx3)}
.pi .nm{flex:1;min-width:0}.pi .nm b{display:block;font:600 14px/1.25 var(--f-body)}
.pi .nm small{display:block;font:400 10.5px/1.35 var(--f-mono);color:var(--tx3);margin-top:2px}
.pi .mn{font:700 12px var(--f-mono);white-space:nowrap;color:var(--tx2)}
.pi:last-of-type{border-bottom:0}
.acts3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;margin-top:14px}.acts3 .btn{padding:0 6px;font-size:11px;letter-spacing:.08em}
.pe{padding:12px 0;border-bottom:1px solid var(--line2)}
.pe .r2{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.lvl{font:700 60px/1 var(--f-disp);color:var(--v);text-shadow:0 0 26px rgba(167,139,255,.6)}
.msg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mst{border:1px solid var(--line2);padding:10px;min-height:92px}
.mst.ok{border-color:var(--g);background:rgba(57,255,136,.06)}
.mst b{display:block;font:700 11px/1.3 var(--f-mono);letter-spacing:.08em;color:var(--tx3)}.mst.ok b{color:var(--g)}
.mst small{display:block;font:400 10.5px/1.35 var(--f-mono);color:var(--tx3);margin-top:4px}
.mst .bar{margin-top:8px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat i{aspect-ratio:1;background:rgba(57,255,136,.05);border:1px solid var(--line2);display:block}
.heat i.l1{background:rgba(57,255,136,.22)}.heat i.l2{background:rgba(57,255,136,.42)}.heat i.l3{background:rgba(57,255,136,.68)}.heat i.l4{background:var(--g);box-shadow:0 0 8px rgba(57,255,136,.6)}
.heat i.fut{opacity:.25;border-style:dashed}
.heat.hl{margin-bottom:6px}.heat.hl span{text-align:center;font:600 9.5px var(--f-mono);color:var(--tx3)}

/* --- phase 5: scan syllabus --- */
.note{border-left:2px solid var(--c);padding:8px 12px;background:rgba(40,224,255,.06);font:500 12px/1.5 var(--f-mono);color:var(--tx2);margin-bottom:12px}
.note.warn{border-color:var(--amber);background:rgba(255,181,71,.06)}

.thumb{display:block;max-width:100%;max-height:170px;margin:0 auto 12px;border:1px solid var(--line2)}
.rd{display:inline-block;animation:blink 1.1s infinite}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 14px;border:1px dashed var(--line);text-align:center;margin-bottom:12px}
.drop b{font:700 13px var(--f-mono);letter-spacing:.12em}

/* --- phase 4: recall --- */
.rcq{font:600 19px/1.45 var(--f-body);margin:12px 0 14px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grade .btn{padding:0 4px;font-size:11px;letter-spacing:.08em}
/* --- phase 7: accessibility, contrast, polish --- */
:root{--tx3:#7C9C8C}
html.hc{--tx3:#B3CDBF;--tx2:#C8DED2;--line2:rgba(140,255,200,.32);--line:rgba(57,255,136,.6);--linehi:rgba(57,255,136,.9)}
html.bg *{animation-play-state:paused!important}
.lbl{font-size:11.5px}.chip{font-size:10.5px;height:24px}.fine,.meta,.tile small,.legend small,.qmain small,.hm small,.pi .nm small{font-size:11.5px}
.pips{font-size:10px}.tabs button{font-size:10.5px}.segc button{font-size:10px}.status{font-size:10.5px}#nav button{font-size:10px;letter-spacing:.02em}.ob{font-size:11px}.cyc li{font-size:12px}
.tstats .lbl{font-size:10px;letter-spacing:.08em}
.hrow .ibtn{width:44px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--g);color:#02110A;padding:12px 16px;font:700 12px var(--f-mono)}.skip:focus{left:8px;top:8px}
#view:focus{outline:none}
.glyph{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.radial-ov{position:absolute;inset:0;z-index:26;background:rgba(1,4,6,.7);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:fade .15s}
.radial{position:absolute;width:0;height:0}
.rring{position:absolute;left:-100px;top:-100px;width:200px;height:200px;animation:spin 16s linear infinite}
.rring circle{fill:none;stroke:rgba(57,255,136,.55);stroke-width:1;stroke-dasharray:2 7}.rring .r2{stroke:rgba(40,224,255,.55);stroke-dasharray:16 6}
.rc{position:absolute;left:-42px;top:-42px;width:84px;height:84px;display:grid;place-items:center;text-align:center;font:700 10px/1.3 var(--f-mono);letter-spacing:.1em;color:var(--g);text-shadow:0 0 10px rgba(57,255,136,.6)}
.rb{position:absolute;left:-31px;top:-31px;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);transform:translate(var(--x),var(--y));animation:rbIn .3s cubic-bezier(.2,1.4,.4,1) both;transition:box-shadow .15s,border-color .15s,transform .15s}
.rb.cur{border-color:var(--c)}
.rb.hot,.rb:focus-visible{border-color:var(--g);box-shadow:0 0 18px rgba(57,255,136,.65);transform:translate(var(--x),var(--y)) scale(1.16)}
@keyframes rbIn{from{transform:translate(0,0) scale(.3) rotate(-120deg);opacity:0}}

/* --- v2: card levels (primary / secondary / utility) --- */
.p1{--cut:14px;--bd:rgba(57,255,136,.4);--pbg:linear-gradient(180deg,#0A1B25,#07121A)}
.p2{--cut:10px}
.p3{--cut:8px;--bd:rgba(120,255,190,.14)}
.hcols{display:flex;flex-direction:column;gap:18px}.hcol{display:flex;flex-direction:column;gap:16px;min-width:0}.hcol>.sec{margin-top:0}
.btn:disabled,.btn[disabled]{opacity:.38;filter:saturate(.4)}
@media (hover:hover){.btn:hover{filter:brightness(1.12)}.btn.ghost:hover{filter:brightness(1.3)}.ibtn:hover{color:var(--g);border-color:var(--line)}.card:hover,.qrow:hover,.trow:hover{filter:brightness(1.12)}}
.idx{font:600 9.5px var(--f-mono);letter-spacing:.12em;color:var(--tx3);font-style:normal;margin-right:7px;vertical-align:1px}
/* home */
.covrow{display:flex;align-items:center;gap:16px}
.dial.sm{width:128px;margin:0;flex:none}.corem{color:var(--g);display:block}
.covtxt{flex:1;min-width:0}.covn{font:700 clamp(46px,14vw,58px)/1 var(--f-disp);margin:6px 0 10px;font-variant-numeric:tabular-nums}
.covn em{font-size:.42em;font-style:normal;color:var(--g);margin-left:2px}
.cyt{color:var(--c)!important}
.sighead{font:700 19px/1.25 var(--f-disp);letter-spacing:.04em;margin:8px 0 4px}
.trows{margin-top:6px}
.trow{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:6px 0;border-bottom:1px solid var(--line2);text-align:left}
.trows .trow:last-child,.trow.last{border-bottom:0}
.trm{flex:1;min-width:0}.trm small{display:block;font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.trm b{display:block;font:600 14.5px/1.3 var(--f-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trn{font:700 12px var(--f-mono);color:var(--v);width:22px;flex:none}
.sigacts{display:grid;grid-template-columns:1.5fr 1fr;gap:10px;margin-top:14px}
.stag{font:600 10px var(--f-mono);letter-spacing:.14em;color:var(--tx3)}
.scard .in{padding:12px 14px}
.act{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--line2);font-size:13px}
.act:last-child{border-bottom:0}
.ak{font:700 10.5px var(--f-mono);letter-spacing:.08em;width:96px;flex:none;color:var(--tx2)}
.ak.gr{color:var(--g)}.ak.cy{color:var(--c)}.ak.vi{color:var(--v)}.ak.am{color:var(--amber)}
.an{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.an em{font-style:normal;color:var(--tx3);font:400 11px var(--f-mono);margin-left:6px}
.at{font:500 11px var(--f-mono);color:var(--tx3);white-space:nowrap}
.mini4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini{display:block;text-align:left;width:100%;min-width:0}.mini .in{display:block;padding:11px 12px 12px}
.mini b{display:block;font:700 21px/1.1 var(--f-disp);margin-top:6px;white-space:nowrap}.mini small{display:block;font:400 10.5px var(--f-mono);color:var(--tx3);margin-top:2px}
.mini .lbl{font-size:10px;letter-spacing:.1em}
.mini.hot b{color:var(--red)}.mini.warn b{color:var(--amber)}
/* syllabus tree + topic card */
.cbody{margin-left:9px;padding-left:13px;border-left:1px dashed var(--line)}
.swipe::before{content:"";position:absolute;left:-13px;top:26px;width:11px;border-top:1px dashed var(--line)}
.tcard .in{align-items:flex-start;padding:8px 10px 8px 6px}
.tbody{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.trow1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tnext{font:700 11px var(--f-mono);color:var(--c);text-align:right;white-space:nowrap;letter-spacing:.04em}.tnext small{display:block;color:var(--tx3);font-size:9.5px;letter-spacing:.12em;font-weight:600}
.tprog{display:flex;align-items:center;gap:8px;margin:7px 0 7px}.tprog .bar{flex:1}

.tag.gr{color:var(--g);border-color:rgba(57,255,136,.4)}.tag.cy{color:var(--c);border-color:rgba(40,224,255,.45)}.tag.am{color:var(--amber);border-color:rgba(255,181,71,.45)}.tag.rd{color:var(--red);border-color:rgba(255,90,122,.5)}.tag.vi{color:var(--v);border-color:rgba(167,139,255,.45)}
.tcard.t-notstarted .tname{color:var(--tx2)}
/* topic loop */
.loop{display:flex;margin:2px 0 6px}
.ls{flex:1;position:relative;text-align:center;min-width:0}

.bar{overflow:hidden}.bar.ind>i{width:34%!important;animation:indet 1.3s ease-in-out infinite}

.srow .r1{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.srow .r1 b{font:700 14px var(--f-disp);letter-spacing:.06em;text-transform:uppercase}.srow .r1 span{font:700 15px var(--f-disp)}
/* nav pill */

}
@media (prefers-reduced-motion:reduce){html:not(.fx) *,html:not(.fx) *::before,html:not(.fx) *::after{animation:none!important;transition:none!important}html:not(.fx) .sweep{display:none}}

  <main id="view" tabindex="-1"></main>

<noscript>MATRIKA needs JavaScript to run.</noscript>
<script>
(function(){
'use strict';
/* =====================================================================
   MATRIKA//CORE — single-file build. Sections:
   01 util · 02 storage · 03 model · 04 calc (progress/revision/priority)
   05 AIService · 06 seed · 07 state+actions · 08 components · 09 views
   10 sheets · 11 onboarding · 12 events+boot
   ===================================================================== */

/* ---------- 01 UTIL ---------- */
const DAY=864e5;
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const sod=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
const today=()=>sod(Date.now());
const addDays=(ts,n)=>{const d=new Date(sod(ts));d.setDate(d.getDate()+n);return d.getTime()};
const daysFromToday=ts=>Math.round((sod(ts)-today())/DAY);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const pct=(a,b)=>b?Math.round(a/b*100):0;
const fmtDate=ts=>new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
const ago=ts=>{const d=-daysFromToday(ts);return d<=0?'today':d===1?'yesterday':d+' days ago'};
const times=n=>n===1?'once':n===2?'twice':n+' times';
const inDays=d=>d===0?'today':d===1?'tomorrow':d>0?'in '+d+' days':(-d)+'d overdue';

/* ---------- 02 STORAGE (local-first) ---------- */
const Store=(()=>{const KEY='matrika.core.v1';let mem=null;
  return{
    load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):mem}catch(e){return mem}},
    save(s){const j=JSON.stringify(s);try{localStorage.setItem(KEY,j);return true}catch(e){try{mem=JSON.parse(j)}catch(_){}return false}},
    clear(){mem=null;try{localStorage.removeItem(KEY)}catch(e){}}
  }})();

/* ---------- 03 MODEL ---------- */
const COLORS=['#39FF88','#28E0FF','#A78BFF','#4D8DFF','#FFB547','#FF6FB1'];
const STATES=['notstarted','studying','studied','mastered'];
const SHORT={notstarted:'NOT STARTED',studying:'STUDYING',studied:'STUDIED',mastered:'MASTERED'};
const CONF=['low','medium','high'];
const Model={
  blank(){return{v:1,onboarded:false,
    user:{id:uid('usr'),academicYear:'2026-27',createdAt:Date.now()},
    settings:{intervals:[1,3,7,14],motion:'auto',aiProvider:null,cloudSync:false,sound:true,dailyMinutes:180},
    subjects:[],chapters:[],topics:[],revisions:[],sessions:[],exams:[],dailyPlans:[],recalls:[],progress:{seen:[],level:1},timer:TM.def()
    /* Statistics is derived from the arrays above — never stored. */}},
  subject(name,color,order){const t=Date.now();return{id:uid('sub'),name,color:color||COLORS[order%COLORS.length],order,createdAt:t,updatedAt:t}},
  chapter(subjectId,name,order){const t=Date.now();return{id:uid('chp'),subjectId,name,order,createdAt:t,updatedAt:t}},
  topic(subjectId,chapterId,name,order,o){const t=Date.now();
    return Object.assign({id:uid('top'),subjectId,chapterId,name,description:'',difficulty:3,importance:3,
      completionState:'notstarted',studyCount:0,revisionCount:0,lastStudied:null,lastRevised:null,nextRevision:null,
      confidence:'medium',cyclesOverride:null,struggles:0,subtopics:[],order,createdAt:t,updatedAt:t},o||{})}
};

/* ---------- 04 CALC ---------- */
let S=null;
const isDone=t=>t.completionState==='studied'||t.completionState==='mastered';
const byOrder=(a,b)=>a.order-b.order;
const subjects=()=>S.subjects.slice().sort(byOrder);
const chaptersOf=sid=>S.chapters.filter(c=>c.subjectId===sid).sort(byOrder);
const topicsOfCh=cid=>S.topics.filter(t=>t.chapterId===cid).sort(byOrder);
const topicsOfSub=sid=>S.topics.filter(t=>t.subjectId===sid);
const getSub=id=>S.subjects.find(x=>x.id===id);
const getCh=id=>S.chapters.find(x=>x.id===id);
const getTopic=id=>S.topics.find(x=>x.id===id);

function coverage(list){let done=0,studying=0,revised=0;
  for(const t of list){if(isDone(t)){done++;if(t.revisionCount>0)revised++}else if(t.completionState==='studying')studying++}
  const total=list.length;return{total,done,studying,revised,study:pct(done,total),rev:pct(revised,total)}}
function examFor(sid){const n=today();return S.exams.filter(e=>e.subjectId===sid&&sod(e.date)>=n).sort((a,b)=>a.date-b.date)[0]||null}
function examDays(sid){const e=examFor(sid);return e?daysFromToday(e.date):null}

const CONF_MOD={low:.5,medium:1,high:1.5};
function offsetDay(k){const iv=S.settings.intervals;if(k<0)return 0;if(k<iv.length)return iv[k];return iv[iv.length-1]+14*(k-iv.length+1)}
function nextDate(baseDay,k,conf){const gap=offsetDay(k)-offsetDay(k-1);return addDays(baseDay,Math.max(1,Math.round(gap*(CONF_MOD[conf]||1))))}
function suggestCycles(t){let n=4;const why=[];
  if(t.difficulty>=4){n++;why.push('high difficulty')}
  if(t.confidence==='low'){n++;why.push('low confidence')}
  if((t.struggles||0)>=2){n++;why.push('struggled in recent revisions')}
  const rc=recallOf(t);if(rc[0]&&rc[0].score<.5){n++;why.push('weak last recall')}else if(rc.length>=2&&rc[0].score>=.8&&rc[1].score>=.8&&t.difficulty<=3){n--;why.push('strong recall twice in a row')}
  if(t.confidence==='high'&&t.difficulty<=3){n--;why.push('high confidence')}
  if(!why.length)why.push('standard difficulty and confidence');
  return{n:clamp(n,3,6),why}}
const totalCycles=t=>t.cyclesOverride||suggestCycles(t).n;
function cycleNames(n){const out=['LEARN'];const m=Math.max(0,n-2);
  if(m===1)out.push('REVISION 1');else if(m===2)out.push('REVISION 1','ACTIVE RECALL');
  else if(m>=3){out.push('REVISION 1','REVISION 2','ACTIVE RECALL');for(let i=3;i<m;i++)out.push('REVISION '+i)}
  out.push('FINAL REVISION');return out}
function reschedule(t){
  if(!isDone(t)){t.nextRevision=null;return}
  const n=totalCycles(t),k=t.revisionCount;
  if(k>=n-1){t.nextRevision=null;return}
  t.nextRevision=nextDate(sod(t.lastRevised||t.lastStudied||Date.now()),k,t.confidence)}
function status(t){
  if(!isDone(t))return'none';
  if(t.revisionCount>=totalCycles(t)-1)return'completed';
  if(t.nextRevision==null)return'none';
  const d=daysFromToday(t.nextRevision);return d<0?'overdue':d===0?'today':'upcoming'}
const overdueDays=t=>status(t)==='overdue'?-daysFromToday(t.nextRevision):0;
const cyclesDone=t=>Math.min(totalCycles(t),(isDone(t)?1:0)+t.revisionCount);
function projection(t){
  const n=totalCycles(t),names=cycleNames(n);
  const logs=S.revisions.filter(r=>r.topicId===t.id).sort((a,b)=>a.date-b.date);
  const learn=logs.find(r=>r.type==='LEARN'),revs=logs.filter(r=>r.type!=='LEARN'&&r.type!=='STUDY PASS');
  const rows=[{label:names[0],done:isDone(t),date:isDone(t)?(learn?learn.date:t.lastStudied):null}];
  let prev=null;
  for(let k=0;k<n-1;k++){
    const done=k<t.revisionCount;let date=null;
    if(done)date=revs[k]?revs[k].date:null;
    else if(isDone(t))date=(k===t.revisionCount||prev==null)?t.nextRevision:nextDate(sod(prev),k,t.confidence);
    rows.push({label:names[k+1],done,date});prev=date}
  return rows}
function examBoost(t){const d=examDays(t.subjectId);return d==null?0:Math.max(0,30-d)*.8}
function priority(t){const eb=examBoost(t);
  if(!isDone(t))return t.importance*8+t.difficulty*3+(t.completionState==='studying'?12:0)+eb;
  const stale=t.revisionCount===0?clamp(-daysFromToday(t.lastStudied||Date.now()),0,14)*1.2:0;
  return overdueDays(t)*5+(t.confidence==='low'?18:t.confidence==='medium'?5:0)+(t.struggles||0)*6+recallPenalty(t)+t.difficulty*2+t.importance*2+stale+eb}
function attentionList(){return S.topics.filter(t=>{if(!isDone(t))return false;
  return status(t)==='overdue'||t.confidence==='low'||recallWeak(t)||(t.revisionCount===0&&-daysFromToday(t.lastStudied||Date.now())>=7)}).sort((a,b)=>priority(b)-priority(a))}
function queue(limit){
  const rev=S.topics.filter(t=>['overdue','today'].includes(status(t))).sort((a,b)=>(status(b)==='overdue')-(status(a)==='overdue')||priority(b)-priority(a)).slice(0,3).map(t=>({t,kind:'revise'}));
  const st=S.topics.filter(t=>!isDone(t)).sort((a,b)=>priority(b)-priority(a)).slice(0,limit-rev.length).map(t=>({t,kind:'study'}));
  return rev.concat(st)}
function activityDays(){const s=new Set();S.revisions.forEach(r=>s.add(sod(r.date)));S.sessions.forEach(x=>s.add(sod(x.start)));return s}
function streak(){const set=activityDays();let d=today();if(!set.has(d))d=addDays(d,-1);let n=0;while(set.has(d)){n++;d=addDays(d,-1)}return n}
const counts=()=>{let od=0,td=0,up=0,dn=0;S.topics.forEach(t=>{const s=status(t);if(s==='overdue')od++;else if(s==='today')td++;else if(s==='upcoming')up++;else if(s==='completed')dn++});return{od,td,up,dn}};

/* ---------- 05 AI SERVICE (local heuristics now, provider later) ---------- */
const AIService={
  provider:null,
  connected(){return !!this.provider},
  async analyzeSyllabus(o){if(!this.has('analyzeSyllabus'))return{ok:false,code:'AI_NOT_CONNECTED'};try{return await this.provider.analyzeSyllabus(o)}catch(e){return{ok:false,code:(e&&e.code)||'upstream_error'}}},
  async generateRevisionPlan(o){o=o||{};if(this.has('generateRevisionPlan'))return this.provider.generateRevisionPlan(o);return{ok:true,source:'local',days:revisionAgenda(o.days||7)}},
  async generateRecallQuestions(o){if(!this.has('generateRecallQuestions'))return{ok:false,code:'AI_NOT_CONNECTED'};try{return await this.provider.generateRecallQuestions(o)}catch(e){return{ok:false,code:(e&&e.code)||'upstream_error'}}},
  has(f){return !!(this.provider&&typeof this.provider[f]==='function')},
  async generateDailyPlan(o){o=o||{};if(this.has('generateDailyPlan'))return this.provider.generateDailyPlan(o);const budget=o.budget||180;return{ok:true,source:'local',budget,items:buildPlan(budget)}},
  analyzeTopicPriority(t){return{score:priority(t)}},
  suggestRevisionCount(t){return suggestCycles(t)},
  signal(){
    if(!S.topics.length)return{msg:'No syllabus yet. Add a subject or paste an outline so MATRIKA can start tracking coverage.',cta:'IMPORT SYLLABUS',act:'openImport'};
    const att=attentionList();
    if(att.length){const t=att[0],st=status(t);let msg;
      if(st==='overdue'&&t.revisionCount>0)msg=`${t.name} has been studied ${times(t.studyCount)} but was last revised ${ago(t.lastRevised)}. It is ${plural(overdueDays(t),'day')} overdue.`;
      else if(st==='overdue')msg=`${t.name} was studied ${ago(t.lastStudied)} and has not been revised yet. Revision was due ${plural(overdueDays(t),'day')} ago.`;
      else if(recallWeak(t))msg=`Your last recall on ${t.name} scored ${Math.round(recallOf(t)[0].score*100)}%. Revisit it before moving on.`;
      else if(t.confidence==='low')msg=`You rated ${t.name} low confidence. A short revision now would help it stick.`;
      else msg=`${t.name} was studied ${ago(t.lastStudied)} and has not been revised yet.`;
      return{msg,cta:'REVIEW NOW',act:'openTopic',id:t.id}}
    const nx=S.topics.filter(t=>!isDone(t)).sort((a,b)=>priority(b)-priority(a))[0];
    if(nx){const d=examDays(nx.subjectId),sub=getSub(nx.subjectId);
      return{msg:`${nx.name} (${sub.name}) is next by priority: importance ${nx.importance}/5${d!=null?', exam in '+plural(d,'day'):''}. No revisions are overdue.`,cta:'START TOPIC',act:'openTopic',id:nx.id}}
    return{msg:`All ${S.topics.length} topics are studied and none are overdue. Keep spacing revisions to lock them in.`,cta:'OPEN SYLLABUS',act:'go',tab:'syllabus'}}
};

/* ---------- 06 SEED (demo system) ---------- */
const SEED=[
{n:'Mathematics',c:COLORS[0],exam:21,ch:[
 {n:'Calculus',t:[

  ['Matrix Decomposition','N',4,3]]},
 {n:'Differential Equations',t:[

  ['Exact Equations','D',3,4,'m',12,[9,4]],

  ['Conditional Probability','D',3,4,'m',7,[1]],

{n:'Physics',c:COLORS[1],exam:34,ch:[
 {n:'Mechanics',t:[
  ['Kinematics','M',2,4,'h',36,[28,20,9]],
  ['Newton\'s Laws of Motion','D',2,5,'h',31,[24,13,6]],

 {n:'Thermodynamics',t:[

{n:'Programming',c:COLORS[3],exam:14,ch:[

  ['File Handling','N',3,3]]}]}];
const SEED_SUBS={
  'Vector Spaces':[['Linear Independence',1],['Basis',1],['Dimension',1],['Rank',0]],

    if(name)rows.push({ind,name:name.slice(0,80)})});
  const stack=[],out=[];let cs=null,cc=null,ct=null;
  rows.forEach(r=>{while(stack.length&&stack[stack.length-1]>=r.ind)stack.pop();const lv=stack.length;stack.push(r.ind);
    if(lv===0){cs={name:r.name,chapters:[]};out.push(cs);cc=ct=null}
    else if(lv===1){cc={name:r.name,topics:[]};cs.chapters.push(cc);ct=null}
    else if(lv===2){ct={name:r.name,subs:[]};cc.topics.push(ct)}

function screenName(){if(!S||!S.onboarded||ui.onbBoot)return'Setup step '+ui.onb.step;
  if(ui.tab==='syllabus'&&ui.subjectId&&getSub(ui.subjectId))return getSub(ui.subjectId).name+' chapters and topics';
  if(ui.tab==='stats'&&ui.meterId&&getSub(ui.meterId))return getSub(ui.meterId).name+' breakdown';
  return({home:'Home',syllabus:'Syllabus',recall:'AI recall',timer:'Focus timer',stats:'Statistics'})[ui.tab]||'MATRIKA'}
function vibe(n){try{if(!motionOff()&&navigator.vibrate)navigator.vibrate(n)}catch(e){}}
let lp=null,rad=null;
function closeRadial(){if(rad){rad.el.remove();rad=null}}
function openRadial(id,r,px,py,mode){closeRadial();const t=getTopic(id);if(!t)return;mode=mode||'state';
  const W=$('#shell').getBoundingClientRect(),cx=clamp(r.left+r.width/2-W.left,120,W.width-120),cy=clamp(r.top+r.height/2-W.top,120,W.height-120),pos=[[0,-1],[1,0],[0,1],[-1,0]];
  const cfg=mode==='core'?[['recall','RECALL','recall'],['timer','TIMER','timer'],['stats','STATS','stats'],['study','STUDY','syllabus']]:STATES.map(s=>[s,SHORT[s],null]),labels={};cfg.forEach(c=>{labels[c[0]]=c[1]});
  const el=document.createElement('div');el.className='radial-ov';el.setAttribute('role','dialog');el.setAttribute('aria-label',(mode==='core'?'MATRIKA core actions for ':'Choose status for ')+t.name);
  el.innerHTML=`<div class="radial" style="left:${cx}px;top:${cy}px"><svg class="rring" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="92"/><circle class="r2" cx="100" cy="100" r="56"/></svg><div class="rc" id="rlabw">${coreSvg(30)}<span id="rlab" aria-live="polite">${mode==='core'?'MATRIKA//CORE':SHORT[t.completionState]}</span></div>${cfg.map((c,i)=>mode==='core'?`<button class="rb core" data-rs="${c[0]}" style="--x:${pos[i][0]*86}px;--y:${pos[i][1]*86}px" aria-label="${c[1]}">${icon(c[2],22)}<span class="rl">${c[1]}</span></button>`:`<button class="rb ${t.completionState===c[0]?'cur':''}" data-rs="${c[0]}" style="--x:${pos[i][0]*80}px;--y:${pos[i][1]*80}px" aria-label="${c[1]}">${glyph(c[0],28)}</button>`).join('')}</div>`;
  $('#shell').appendChild(el);rad={el,id,mode,keys:cfg.map(c=>c[0]),labels,l:W.left,t:W.top,cx,cy,sel:null,down:true,born:Date.now(),px,py,moved:false,base:mode==='core'?'MATRIKA//CORE':SHORT[t.completionState]};vibe(18)}
function radialPoint(x,y){if(!rad||!rad.down)return;if(!rad.moved&&Math.hypot(x-rad.px,y-rad.py)<14)return;rad.moved=true;const dx=x-(rad.l+rad.cx),dy=y-(rad.t+rad.cy);let sel=null;
  if(Math.hypot(dx,dy)>=34)sel=rad.keys[Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0)];
  if(sel!==rad.sel){rad.sel=sel;$$('.rb',rad.el).forEach(b=>b.classList.toggle('hot',b.dataset.rs===sel));const l=$('#rlab',rad.el);if(l)l.textContent=sel?rad.labels[sel]:rad.base}}
const lpCancel=()=>{if(lp){clearTimeout(lp.t);lp=null}};
document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;const g=e.target.closest&&e.target.closest('.glyph,.tbody');if(!g||rad)return;const w=g.closest('[data-topic]');if(!w)return;const md=g.classList.contains('glyph')?'state':'core';
  lp={x:e.clientX,y:e.clientY,id:w.dataset.topic,el:g,md,t:setTimeout(()=>{if(!lp)return;const id=lp.id,px=lp.x,py=lp.y,m=lp.md,r=m==='core'?{left:px,top:py,width:0,height:0}:lp.el.getBoundingClientRect();lp=null;sw=null;ui.noClick=Date.now()+4000;openRadial(id,r,px,py,m)},430)}});
document.addEventListener('pointermove',e=>{if(lp&&Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>10)lpCancel();radialPoint(e.clientX,e.clientY)});
document.addEventListener('pointerup',e=>{lpCancel();if(rad&&rad.down){ui.noClick=Date.now()+350;radialPoint(e.clientX,e.clientY);rad.down=false;if(rad.sel){radialApply(rad.id,rad.mode,rad.sel)}}});
document.addEventListener('pointercancel',()=>{lpCancel();if(rad){rad.down=false;ui.noClick=Date.now()+350}});
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.glyph,.tbody'))e.preventDefault()});
document.addEventListener('visibilitychange',()=>document.documentElement.classList.toggle('bg',document.hidden));
let lastSoft=0;const soft=()=>{if(Date.now()-lastSoft>6000){lastSoft=Date.now();toast("MATRIKA hit a snag. Your data is safe. Try again.")}};
window.addEventListener('error',e=>{console.error(e.error||e.message);soft()});
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);soft()});
{const sk=$('.skip');if(sk)sk.addEventListener('click',e=>{e.preventDefault();$('#view').focus()})}

function sanitize(){['subjects','chapters','topics','revisions','sessions','exams','dailyPlans','recalls'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
  S.settings=Object.assign({intervals:[1,3,7,14],motion:'auto',aiProvider:null,cloudSync:false,sound:true,dailyMinutes:180},S.settings||{});
  S.timer=Object.assign(TM.def(),(S.timer&&typeof S.timer==='object')?S.timer:{});
  S.topics.forEach(t=>{if(!Array.isArray(t.subtopics))t.subtopics=[];if(t.struggles==null)t.struggles=0;if(!t.confidence)t.confidence='medium'});
  S.dailyPlans=S.dailyPlans.filter(p=>p&&Array.isArray(p.items));
  if(!S.progress||!Array.isArray(S.progress.seen)){S.progress={seen:[],level:1};checkProgress(true)}}
try{const saved=Store.load();if(saved&&saved.v===1&&Array.isArray(saved.topics)){S=saved;sanitize()}}catch(e){S=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(S&&S.timer&&S.timer.status==='running')lock();tickAll()}});
if(S&&S.timer&&S.timer.status==='running')lock();
setInterval(tickAll,250);
initProvider();
render(true);
})();
</script>
</body>
</html>
